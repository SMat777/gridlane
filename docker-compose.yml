# Gridlane Docker Compose — dev services
#
# Database is managed by Supabase CLI (`supabase start`), not Docker Compose.
# Run `supabase start` BEFORE `docker compose up`.
#
# Stack:
#   supabase start  → Postgres, Auth, Realtime, Studio (port 54322/54321/54323)
#   docker compose  → web (3000), engine (8000), redis (6379)

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - engine

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # host.docker.internal lets the container reach Supabase CLI on the host
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./apps/engine/app:/app/app
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
